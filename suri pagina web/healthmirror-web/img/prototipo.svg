<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="520" height="420" role="img" aria-label="Ilustración del prototipo HealthMirror Pro 3D instalado en la pared">
  <defs>
    <linearGradient id="pared" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16303F"/>
      <stop offset="1" stop-color="#0F1B24"/>
    </linearGradient>
    <linearGradient id="cristal2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E5A70"/>
      <stop offset="1" stop-color="#142936"/>
    </linearGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF0F2" stop-opacity=".22"/>
      <stop offset="0.5" stop-color="#EAF0F2" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="520" height="420" rx="18" fill="url(#pared)"/>
  <g opacity=".35" stroke="#63E3C8" stroke-width="1">
    <line x1="0" y1="330" x2="520" y2="330"/>
  </g>

  <!-- halo LED -->
  <rect x="96" y="44" width="300" height="212" rx="20" fill="none" stroke="#63E3C8" stroke-width="5" opacity=".55" filter="url(#glow)"/>
  <!-- marco -->
  <rect x="96" y="44" width="300" height="212" rx="20" fill="url(#cristal2)" stroke="#8FA8B5" stroke-width="3"/>
  <rect x="106" y="54" width="280" height="192" rx="14" fill="#122633"/>
  <rect x="106" y="54" width="280" height="192" rx="14" fill="url(#brillo)"/>

  <!-- interfaz -->
  <text x="124" y="92" font-family="Sora, Segoe UI, sans-serif" font-size="28" font-weight="600" fill="#EAF0F2">07:28</text>
  <text x="124" y="110" font-family="Karla, Segoe UI, sans-serif" font-size="11" fill="#9FBAC6">Lunes · 18 °C</text>

  <g>
    <rect x="124" y="126" width="118" height="102" rx="10" fill="#63E3C8" opacity=".10"/>
    <text x="136" y="146" font-family="Karla, sans-serif" font-size="11" fill="#63E3C8">Rutina mañana</text>
    <g font-family="Karla, sans-serif" font-size="10.5" fill="#D6E3E9">
      <circle cx="141" cy="163" r="4" fill="#63E3C8"/><text x="152" y="167">1. Limpieza facial</text>
      <circle cx="141" cy="184" r="4" fill="#FFB65C"/><text x="152" y="188">2. Tónico</text>
      <circle cx="141" cy="205" r="4" fill="none" stroke="#7FA0AF" stroke-width="1.6"/><text x="152" y="209">3. Hidratación</text>
    </g>
  </g>

  <g>
    <rect x="252" y="126" width="118" height="102" rx="10" fill="#FFB65C" opacity=".08"/>
    <circle cx="311" cy="172" r="33" fill="none" stroke="#25414F" stroke-width="7"/>
    <circle cx="311" cy="172" r="33" fill="none" stroke="#63E3C8" stroke-width="7" stroke-linecap="round"
            stroke-dasharray="150 60" transform="rotate(-90 311 172)"/>
    <text x="311" y="176" text-anchor="middle" font-family="Sora, sans-serif" font-size="15" font-weight="600" fill="#EAF0F2">01:45</text>
    <text x="311" y="218" text-anchor="middle" font-family="Karla, sans-serif" font-size="10" fill="#9FBAC6">temporizador</text>
  </g>

  <!-- repisa organizadora -->
  <rect x="112" y="268" width="268" height="14" rx="7" fill="#8FA8B5"/>
  <rect x="112" y="282" width="268" height="10" rx="5" fill="#5C7885" opacity=".7"/>
  <g>
    <rect x="132" y="236" width="20" height="32" rx="6" fill="#63E3C8" opacity=".75"/>
    <rect x="160" y="244" width="16" height="24" rx="5" fill="#FFB65C" opacity=".85"/>
    <rect x="184" y="240" width="22" height="28" rx="7" fill="#EAF0F2" opacity=".65"/>
    <rect x="300" y="242" width="18" height="26" rx="5" fill="#FFB65C" opacity=".55"/>
    <rect x="326" y="234" width="20" height="34" rx="6" fill="#63E3C8" opacity=".45"/>
  </g>

  <!-- planta y detalles -->
  <path d="M424 300c0-26 12-40 26-46-4 18-6 32-6 46z" fill="#3E7A63"/>
  <path d="M444 300c6-20 18-28 30-30-8 14-14 20-18 30z" fill="#4E9679"/>
  <rect x="418" y="300" width="60" height="30" rx="8" fill="#8FA8B5" opacity=".8"/>

  <text x="96" y="368" font-family="Sora, sans-serif" font-size="14" font-weight="600" fill="#EAF0F2">HealthMirror Pro 3D</text>
  <text x="96" y="388" font-family="Karla, sans-serif" font-size="11.5" fill="#9FBAC6">Marco de aluminio · LED perimetral graduable · repisa modular</text>
</svg>
